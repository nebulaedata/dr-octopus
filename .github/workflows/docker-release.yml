# /**
#  * @author Codex
#  * @description Builds and tests an already-published npm release on GitHub before publishing Docker Hub images.
#  */
# 首次使用请先阅读同目录 README.md（.github/workflows/README.md），
# 按说明配置 Docker Hub 账号、DOCKERHUB_USERNAME / DOCKERHUB_TOKEN Secrets 及 GitHub 权限。
name: Docker release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published Release tag, e.g. v0.0.10'
        required: true
        type: string
      image_revision:
        description: '0 for the npm version tag; 1 creates VERSION-r1 (never overwrites)'
        default: '0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: docker-hub-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nebulaedata/dr-octopus'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE_REVISION: ${{ inputs.image_revision || '0' }}
    steps:
      - name: Validate tag before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          [[ "$IMAGE_REVISION" =~ ^(0|[1-9][0-9]*)$ ]] || exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Test release policy and Compose configuration
        run: |
          node --test deploy/docker/test/*.test.mjs
          docker compose --env-file deploy/docker/.env.example -f deploy/docker/compose.yaml config --quiet

      - name: Resolve published release and existing image
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/docker/release.mjs prepare

      - name: Wait up to 15 minutes for the public npm package
        if: steps.release.outputs.digest == ''
        env:
          NPM_VERSION: ${{ steps.release.outputs.version }}
        run: node deploy/docker/npm-ready.mjs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx

      - name: Pin the base image for both build steps
        if: steps.release.outputs.digest == ''
        id: base
        shell: bash
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect node:24-bookworm-slim --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "image=node:24-bookworm-slim@$digest" >> "$GITHUB_OUTPUT"

      - name: Build exact npm version locally on the GitHub runner
        if: steps.release.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: deploy/docker
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          provenance: false
          sbom: false
          tags: ${{ steps.release.outputs.reference }}
          build-args: |
            NODE_IMAGE=${{ steps.base.outputs.image }}
            DR_OCTOPUS_VERSION=${{ steps.release.outputs.version }}
            IMAGE_REVISION=${{ env.IMAGE_REVISION }}
            SOURCE_COMMIT=${{ steps.release.outputs.commit }}
          cache-from: type=gha

      - name: Reuse an already-published immutable image
        if: steps.release.outputs.digest != ''
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          IMAGE_REFERENCE: ${{ steps.release.outputs.reference }}
        run: |
          docker pull "docker.io/nebulaedata01/dr-octopus@$DIGEST"
          docker tag "docker.io/nebulaedata01/dr-octopus@$DIGEST" "$IMAGE_REFERENCE"

      - name: Verify image startup, Web and persistent volumes
        env:
          IMAGE_REFERENCE: ${{ steps.release.outputs.reference }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.commit }}
        run: node deploy/docker/smoke.mjs

      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check the version tag is still absent
        if: steps.release.outputs.digest == ''
        run: node deploy/docker/release.mjs check-tag

      # Docker's test-before-push pattern: identical inputs and the same builder reuse tested layers.
      # Keep the base digest pinned and pull disabled here so a newer base cannot replace the tested one.
      - name: Publish tested image with Docker's official action
        if: steps.release.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: deploy/docker
          platforms: linux/amd64
          push: true
          pull: false
          provenance: false
          sbom: false
          tags: ${{ steps.release.outputs.reference }}
          build-args: |
            NODE_IMAGE=${{ steps.base.outputs.image }}
            DR_OCTOPUS_VERSION=${{ steps.release.outputs.version }}
            IMAGE_REVISION=${{ env.IMAGE_REVISION }}
            SOURCE_COMMIT=${{ steps.release.outputs.commit }}
          cache-to: type=gha,mode=max

      - name: Verify anonymous Docker Hub pull
        env:
          IMAGE_REFERENCE: ${{ steps.release.outputs.reference }}
        run: |
          set -euo pipefail
          tested_id=$(docker image inspect "$IMAGE_REFERENCE" --format '{{.Id}}')
          mkdir -p "$RUNNER_TEMP/docker-anonymous"
          docker --config "$RUNNER_TEMP/docker-anonymous" pull --platform linux/amd64 "$IMAGE_REFERENCE"
          test "$tested_id" = "$(docker image inspect "$IMAGE_REFERENCE" --format '{{.Id}}')"

      - name: Package and upload versioned installation files
        env:
          INSTALLER_DIR: ${{ runner.temp }}/dr-octopus-installer
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node deploy/docker/release.mjs installer
          docker compose --env-file "$INSTALLER_DIR/.env.example" -f "$INSTALLER_DIR/compose.yaml" config --quiet
          archive="$RUNNER_TEMP/dr-octopus-docker-$IMAGE_TAG.zip"
          (cd "$INSTALLER_DIR" && zip -X "$archive" compose.yaml .env.example README.md README.zh-CN.md)
          gh release upload "$RELEASE_TAG" "$archive" --clobber

      - name: Decide whether latest can advance
        id: latest
        env:
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: node deploy/docker/release.mjs latest-plan

      - name: Point latest to the verified stable image
        if: steps.latest.outputs.promote == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.release.outputs.reference }}
          LATEST_REFERENCE: ${{ steps.latest.outputs.reference }}
        run: |
          docker tag "$IMAGE_REFERENCE" "$LATEST_REFERENCE"
          docker push "$LATEST_REFERENCE"

      - name: Report Docker installation readiness
        env:
          IMAGE_REFERENCE: ${{ steps.release.outputs.reference }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          echo "Published and verified: \`$IMAGE_REFERENCE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Installer: dr-octopus-docker-$IMAGE_TAG.zip on Release $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
